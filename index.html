<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chess Puzzle — tactics trainer</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♟️</text></svg>">
</head>
<body>
<header>
  <div class="brand">♟️ <strong>Chess Puzzle</strong></div>
  <div class="spacer"></div>
  <div class="stat">Solved: <span id="solved">0</span></div>
  <div class="stat">Streak: <span id="streak">0</span></div>
</header>
<main>
  <aside class="sidebar">
    <div class="puzzle-info">
      <div class="puzzle-num">Puzzle <span id="puzzle-num">1</span></div>
      <div class="puzzle-side" id="puzzle-side">White to move</div>
      <div class="puzzle-hint" id="puzzle-hint">Find the best move.</div>
    </div>
    <div class="moves">
      <h3>Moves</h3>
      <div id="move-list" class="move-list"></div>
    </div>
    <div class="controls">
      <button id="hint-btn" class="btn">💡 Hint</button>
      <button id="reset-btn" class="btn ghost">Reset</button>
      <button id="next-btn" class="btn primary" disabled>Next puzzle →</button>
    </div>
    <div id="feedback" class="feedback"></div>
  </aside>
  <div class="board-wrap">
    <div id="board" class="board"></div>
  </div>
</main>
<script src="chess.js"></script>
<script src="app.js"></script>
</body>
</html>
